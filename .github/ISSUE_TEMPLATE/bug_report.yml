name: Bug report
description: Something in Overture behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Please do **not** report
        security vulnerabilities here — see [SECURITY.md](https://github.com/omerburakpolat/overture/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project in worktree mode
        2. Drag a card from Plan to In Progress
        3. ...
    validations:
      required: true
  - type: input
    id: overture-version
    attributes:
      label: Overture version
      description: Overture → About Overture
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: claude CLI version
      description: Output of `claude --version`
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - Worktree (one worktree per card)
        - Single directory (queued)
        - Not applicable / unsure
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Console output or the card's transcript. Redact anything private.
      render: shell
    validations:
      required: false
