name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo. The release workflow requests contents:write for
# itself; nothing here should be able to write.
permissions:
  contents: read

jobs:
  packages:
    name: Build & test packages
    # macOS 26 image required (SwiftUI/Liquid Glass APIs, Swift 6.2 toolchain).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # Live tests (OVERTURE_LIVE_TESTS) are excluded by default: CI has no
        # claude auth. Everything else must pass.
        run: swift test

  app:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build (unsigned)
        run: |
          if [ -d Overture.xcodeproj ]; then
            xcodebuild -project Overture.xcodeproj -scheme Overture \
              -destination 'platform=macOS,arch=arm64' \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
          else
            echo "App project not created yet — skipping"
          fi
