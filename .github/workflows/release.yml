name: Release

# Tag push (v*) → signed, notarized DMG + appcast on the GitHub release.
# Required repository secrets (docs/RELEASING.md):
#   MACOS_CERT_P12         base64 Developer ID Application cert + key
#   MACOS_CERT_PASSWORD    p12 password
#   NOTARY_APPLE_ID        Apple ID email
#   NOTARY_PASSWORD        app-specific password
#   NOTARY_TEAM_ID         e.g. B2DYXY7U9Y
#   SPARKLE_ED_PRIVATE_KEY EdDSA private key from Sparkle's generate_keys
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          LOGIN_KEYCHAIN="$(security list-keychains -d user | tr -d '\" ' | head -1)"
          security create-keychain -p ci "$KEYCHAIN"
          # default-keychain alone does NOT put it on codesign's search list;
          # keep the login keychain on the list so nothing else breaks.
          security list-keychains -d user -s "$KEYCHAIN" ${LOGIN_KEYCHAIN:+"$LOGIN_KEYCHAIN"}
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          # No arguments = never auto-lock. The default 5-minute idle timeout
          # expires mid-build and codesign then fails with a useless error.
          security set-keychain-settings "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci \
            "$KEYCHAIN" > /dev/null
          rm cert.p12
          # Fail here, with a readable message, rather than deep inside xcodebuild.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in the keychain"; exit 1; }

      # Apple rejects bad notary credentials in seconds. Doing it here means a
      # wrong secret fails immediately instead of after a full signed build,
      # and says which of the three inputs to look at.
      - name: Verify notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          fail=0
          for name in NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            # Indirect expansion, not $(...) — command substitution strips the
            # trailing newline this check exists to catch. And a `case` glob,
            # not grep, because grep is line-oriented and never sees a
            # trailing newline as content.
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty or unset"
              fail=1
              continue
            fi
            case "$value" in
              *[[:space:]]*)
                echo "::error::$name contains whitespace. A trailing newline from 'echo | gh secret set' is the usual cause - use printf instead."
                fail=1
                ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1
          if ! xcrun notarytool history --apple-id "$NOTARY_APPLE_ID" \
                 --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" \
                 >/dev/null 2>notary-err.txt; then
            echo "::error::Apple rejected the notary credentials."
            sed 's/^/  /' notary-err.txt
            echo "NOTARY_PASSWORD must be an app-specific password from appleid.apple.com,"
            echo "not your Apple ID password. NOTARY_APPLE_ID must be the Apple ID that"
            echo "generated it, and NOTARY_TEAM_ID must be B2DYXY7U9Y."
            exit 1
          fi
          echo "Notary credentials accepted."

      - name: Build, sign, package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/release.sh "$VERSION"

      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcrun notarytool store-credentials overture-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"
          scripts/notarize.sh "build/Overture-$VERSION.dmg"

      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          BIN="$(find build/release/DerivedData/SourcePackages -type d \
            -path '*artifacts/sparkle/Sparkle/bin' | head -1)"
          mkdir -p dist && mv build/Overture-*.dmg dist/
          echo "$SPARKLE_ED_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/omerburakpolat/overture/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/omerburakpolat/overture" \
            dist/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Overture-*.dmg
            dist/appcast.xml
          generate_release_notes: true
