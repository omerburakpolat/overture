name: Release

# Tag push (v*) → signed, notarized DMG + appcast on the GitHub release.
# Required repository secrets (docs/RELEASING.md):
#   MACOS_CERT_P12         base64 Developer ID Application cert + key
#   MACOS_CERT_PASSWORD    p12 password
#   NOTARY_KEY_P8_BASE64   base64 of the App Store Connect AuthKey_<ID>.p8
#   NOTARY_KEY_ID          the <ID> from that filename, e.g. GCS84Q43UQ
#   NOTARY_ISSUER_ID       issuer UUID from App Store Connect → Integrations
#   SPARKLE_ED_PRIVATE_KEY EdDSA private key from Sparkle's generate_keys
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          LOGIN_KEYCHAIN="$(security list-keychains -d user | tr -d '\" ' | head -1)"
          security create-keychain -p ci "$KEYCHAIN"
          # default-keychain alone does NOT put it on codesign's search list;
          # keep the login keychain on the list so nothing else breaks.
          security list-keychains -d user -s "$KEYCHAIN" ${LOGIN_KEYCHAIN:+"$LOGIN_KEYCHAIN"}
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          # No arguments = never auto-lock. The default 5-minute idle timeout
          # expires mid-build and codesign then fails with a useless error.
          security set-keychain-settings "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci \
            "$KEYCHAIN" > /dev/null
          rm cert.p12
          # Fail here, with a readable message, rather than deep inside xcodebuild.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in the keychain"; exit 1; }

      # Apple rejects bad notary credentials in seconds. Doing it here means a
      # wrong secret fails immediately instead of after a full signed build,
      # and says which of the three inputs to look at.
      - name: Verify notary credentials
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          fail=0
          for name in NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            # Indirect expansion, not $(...) — command substitution strips the
            # trailing newline this check exists to catch. And a `case` glob,
            # not grep, because grep is line-oriented and never sees a
            # trailing newline as content.
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty or unset"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          # The key id and issuer are single tokens; whitespace means a stray
          # newline got baked in by `echo | gh secret set`. The base64 blob is
          # exempt — it legitimately wraps across lines.
          for name in NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            case "${!name}" in
              *[[:space:]]*)
                echo "::error::$name contains whitespace. A trailing newline from 'echo | gh secret set' is the usual cause - use printf instead."
                exit 1
                ;;
            esac
          done

          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! head -1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::NOTARY_KEY_P8_BASE64 did not decode to a PEM private key. Re-create it with: base64 -i AuthKey_<KEYID>.p8 | pbcopy"
            exit 1
          fi
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          if ! xcrun notarytool history --key "$KEY_PATH" \
                 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
                 >/dev/null 2>notary-err.txt; then
            echo "::error::Apple rejected the notary credentials."
            sed 's/^/  /' notary-err.txt
            echo "Check the key has not been revoked in App Store Connect, that"
            echo "NOTARY_KEY_ID matches the AuthKey_<KEYID>.p8 filename, and that"
            echo "NOTARY_ISSUER_ID is the issuer UUID from Users and Access →"
            echo "Integrations → App Store Connect API."
            exit 1
          fi
          echo "Notary credentials accepted."

      - name: Build, sign, package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/release.sh "$VERSION"

      - name: Notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # NOTARY_KEY_PATH was exported by the preflight step. Its presence is
          # what makes notarize.sh use the API key instead of a keychain
          # profile, so no store-credentials call is needed here at all.
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/notarize.sh "build/Overture-$VERSION.dmg"

      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          BIN="$(find build/release/DerivedData/SourcePackages -type d \
            -path '*artifacts/sparkle/Sparkle/bin' | head -1)"
          mkdir -p dist && mv build/Overture-*.dmg dist/
          # generate_appcast warns and still exits 0 when the private key does
          # not match the SUPublicEDKey baked into the app — producing a
          # well-formed appcast signed with the wrong key, which every existing
          # install would reject. Silent, green, and unrecoverable without a
          # manual re-release. Make it fatal.
          set -o pipefail
          out="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/omerburakpolat/overture/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/omerburakpolat/overture" \
            dist/ 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          case "$out" in
            *"does not match key EdDSA"*)
              echo "::error::SPARKLE_ED_PRIVATE_KEY does not match the SUPublicEDKey in App/Info.plist. Publishing this appcast would break auto-update for every existing install."
              exit 1
              ;;
          esac
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/Overture-*.dmg
            dist/appcast.xml
          generate_release_notes: true
          # SUFeedURL points at /releases/latest/download/appcast.xml, and the
          # action defaults make_latest=true for every tag. Without this,
          # tagging v0.2.0-rc1 would make the RC "latest" and hand its appcast
          # to every stable install. GitHub excludes prereleases from /latest/.
          prerelease: ${{ contains(github.ref_name, '-') }}
