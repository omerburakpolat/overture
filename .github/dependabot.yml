version: 2
updates:
  # Actions are pinned to commit SHAs so a moved tag cannot change what runs
  # in a workflow holding signing secrets. Dependabot is what keeps those
  # pins current — without it, pinning just means silently going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

# Deliberately no `package-ecosystem: swift` entry. Dependabot's Swift support
# reads Package.swift, and this repo's Package.swift declares six local targets
# and no remote dependencies at all — Sparkle is an XCRemoteSwiftPackageReference
# inside Overture.xcodeproj, which Dependabot cannot see. An entry here would
# have looked like coverage while watching nothing. Sparkle is bumped by hand;
# see docs/RELEASING.md.
