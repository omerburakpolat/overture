version: 2
updates:
  # Actions are pinned to commit SHAs so a moved tag cannot change what runs
  # in a workflow holding signing secrets. Dependabot is what keeps those
  # pins current — without it, pinning just means silently going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Swift Package Manager: Sparkle is the only third-party dependency, and it
  # sits directly in the update path, so a security fix there matters.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
